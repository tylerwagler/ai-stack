services:
  # ---------------------------------------------------------
  # HOST METRICS (Port 3001, read-only)
  # GPU/host metrics collection via pynvml + psutil
  # ---------------------------------------------------------
  host-metrics:
    build:
      context: ./host-metrics
    container_name: host-metrics
    hostname: sparky
    restart: always
    ports:
      - "3001:3001"
    environment:
      - METRICS_API_KEY=${METRICS_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # MODEL MANAGER (Port 8100)
  # Dynamic container manager — loads/unloads vLLM models on demand
  # ---------------------------------------------------------
  model-manager:
    build:
      context: ./model-manager
      args:
        MODELS_INI: sparky-models.ini
    container_name: model-manager
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/tyler/.cache/huggingface/hub:/cache/huggingface/hub
    environment:
      - VLLM_IMAGE=${VLLM_IMAGE:-vllm-node:latest}
      - MAX_GPU_UTILIZATION=${MAX_GPU_UTILIZATION:-0.95}
      - HF_CACHE_DIR=/cache/huggingface/hub
