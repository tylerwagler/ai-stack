services:
  # ---------------------------------------------------------
  # VLLM RERANKER (Port 8016)
  # Qwen3-VL-Reranker-2B on GPU via vLLM
  # ---------------------------------------------------------
  sparky-reranker:
    image: vllm-node:latest
    container_name: sparky-reranker
    restart: unless-stopped
    command:
      - vllm
      - serve
      - Qwen/Qwen3-VL-Reranker-2B
      - --port
      - "8016"
      - --runner
      - pooling
      - --trust-remote-code
      - --hf-overrides
      - '{"architectures":["Qwen3VLForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /app/templates/qwen3_vl_reranker.jinja
      - --gpu-memory-utilization
      - "0.070"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "16"
      - --dtype
      - bfloat16
      - --disable-frontend-multiprocessing
    ports:
      - "8016:8016"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
      - ./vl-embed/qwen3_vl_reranker.jinja:/app/templates/qwen3_vl_reranker.jinja:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8016/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM EMBED (Port 8015)
  # Qwen3-VL-Embedding-2B on GPU via vLLM
  # ---------------------------------------------------------
  sparky-embed:
    image: vllm-node:latest
    container_name: sparky-embed
    restart: unless-stopped
    command:
      - vllm
      - serve
      - Qwen/Qwen3-VL-Embedding-2B
      - --port
      - "8015"
      - --runner
      - pooling
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.070"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "16"
      - --dtype
      - float16
      - --disable-frontend-multiprocessing
    ports:
      - "8015:8015"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM QWEN3.5-122B (Port 8012)
  # Intel Qwen3.5-122B-A10B INT4 AutoRound — primary model
  # ---------------------------------------------------------
  sparky-qwen3-5-122b:
    image: vllm-node:latest
    container_name: sparky-qwen3-5-122b
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cd /app/mods && bash run.sh
        exec vllm serve Intel/Qwen3.5-122B-A10B-int4-AutoRound \
          --served-model-name "Qwen3.5 122B" \
          --host 0.0.0.0 \
          --port 8012 \
          --max-model-len 196608 \
          --max-num-seqs 32 \
          --max-num-batched-tokens 4096 \
          --gpu-memory-utilization 0.65 \
          --attention-backend flashinfer \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser qwen3 \
          --enable-prefix-caching \
          --disable-frontend-multiprocessing
    ports:
      - "8012:8012"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
      - ./spark-vllm-docker/mods/fix-qwen3.5-autoround:/app/mods:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
