services:
  # ---------------------------------------------------------
  # VLLM RERANKER (Port 8016)
  # Qwen3-VL-Reranker-2B on GPU via vLLM
  # ---------------------------------------------------------
  vllm-reranker:
    image: vllm-node:latest
    container_name: vllm-reranker
    restart: unless-stopped
    command:
      - vllm
      - serve
      - Qwen/Qwen3-VL-Reranker-2B
      - --port
      - "8016"
      - --runner
      - pooling
      - --trust-remote-code
      - --hf-overrides
      - '{"architectures":["Qwen3VLForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}'
      - --chat-template
      - /app/templates/qwen3_vl_reranker.jinja
      - --gpu-memory-utilization
      - "0.070"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "16"
      - --dtype
      - bfloat16
      - --disable-frontend-multiprocessing
    ports:
      - "8016:8016"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
      - ./vl-embed/qwen3_vl_reranker.jinja:/app/templates/qwen3_vl_reranker.jinja:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8016/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM EMBED (Port 8015)
  # Qwen3-VL-Embedding-2B on GPU via vLLM
  # ---------------------------------------------------------
  vl-embed-gpu:
    image: vllm-node:latest
    container_name: vllm-embed
    restart: unless-stopped
    command:
      - vllm
      - serve
      - Qwen/Qwen3-VL-Embedding-2B
      - --port
      - "8015"
      - --runner
      - pooling
      - --trust-remote-code
      - --gpu-memory-utilization
      - "0.070"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "16"
      - --dtype
      - float16
      - --disable-frontend-multiprocessing
    ports:
      - "8015:8015"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM (Port 8012)
  # Qwen3.5-35B-A3B-FP8 — primary coding model (MoE, ~18GB)
  # ---------------------------------------------------------
  vllm-qwen35:
    image: vllm-node:latest
    container_name: vllm-qwen35
    restart: unless-stopped
    command:
      - vllm
      - serve
      - Qwen/Qwen3.5-35B-A3B-FP8
      - --served-model-name
      - "Qwen3.5 35B"
      - --host
      - "0.0.0.0"
      - --port
      - "8012"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "64"
      - --gpu-memory-utilization
      - "0.50"
      - --reasoning-parser
      - qwen3
      - --load-format
      - fastsafetensors
      - --attention-backend
      - flashinfer
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --speculative-config
      - '{"method":"qwen3_next_mtp","num_speculative_tokens":1}'
      - --seed
      - "3407"
      - --disable-frontend-multiprocessing
    ports:
      - "8012:8012"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
