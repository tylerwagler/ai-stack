services:
  # ---------------------------------------------------------
  # VLLM RERANKER (Port 8016)
  # Qwen3-VL-Reranker-2B on GPU via vLLM
  # ---------------------------------------------------------
  sparky-reranker:
    image: vllm-node:latest
    container_name: sparky-reranker
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        TU=/usr/local/lib/python3.12/dist-packages/vllm/utils/torch_utils.py
        python3 -c "from torch._opaque_base import OpaqueBase" 2>/dev/null \
          || sed -i 's/^HAS_OPAQUE_TYPE = .*/HAS_OPAQUE_TYPE = False/' "$$TU"
        exec vllm serve Qwen/Qwen3-VL-Reranker-2B \
          --port 8016 \
          --runner pooling \
          --trust-remote-code \
          --hf-overrides '{"architectures":["Qwen3VLForSequenceClassification"],"classifier_from_token":["no","yes"],"is_original_qwen3_reranker":true}' \
          --chat-template /app/templates/qwen3_vl_reranker.jinja \
          --gpu-memory-utilization 0.070 \
          --max-model-len 4096 \
          --max-num-seqs 16 \
          --dtype bfloat16 \
          --disable-frontend-multiprocessing
    ports:
      - "8016:8016"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
      - ./vl-embed/qwen3_vl_reranker.jinja:/app/templates/qwen3_vl_reranker.jinja:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8016/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM EMBED (Port 8015)
  # Qwen3-VL-Embedding-2B on GPU via vLLM
  # ---------------------------------------------------------
  sparky-embed:
    image: vllm-node:latest
    container_name: sparky-embed
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        TU=/usr/local/lib/python3.12/dist-packages/vllm/utils/torch_utils.py
        python3 -c "from torch._opaque_base import OpaqueBase" 2>/dev/null \
          || sed -i 's/^HAS_OPAQUE_TYPE = .*/HAS_OPAQUE_TYPE = False/' "$$TU"
        exec vllm serve Qwen/Qwen3-VL-Embedding-2B \
          --port 8015 \
          --runner pooling \
          --trust-remote-code \
          --gpu-memory-utilization 0.070 \
          --max-model-len 4096 \
          --max-num-seqs 16 \
          --dtype float16 \
          --disable-frontend-multiprocessing
    ports:
      - "8015:8015"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM NEMOTRON-3-SUPER (Port 8012)
  # NVIDIA Nemotron-3-Super-120B-A12B NVFP4 — primary model
  # ---------------------------------------------------------
  sparky-nemotron-3-super:
    image: vllm-node:latest
    container_name: sparky-nemotron-3-super
    restart: unless-stopped
    environment:
      - VLLM_NVFP4_GEMM_BACKEND=marlin
      - VLLM_TEST_FORCE_FP8_MARLIN=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        TU=/usr/local/lib/python3.12/dist-packages/vllm/utils/torch_utils.py
        python3 -c "from torch._opaque_base import OpaqueBase" 2>/dev/null \
          || sed -i 's/^HAS_OPAQUE_TYPE = .*/HAS_OPAQUE_TYPE = False/' "$$TU"
        cd /app/mods/nemotron-super && WORKSPACE_DIR=/workspace/vllm bash run.sh
        exec vllm serve nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4 \
          --served-model-name "Nemotron 3 Super" \
          --host 0.0.0.0 \
          --port 8012 \
          --kv-cache-dtype fp8 \
          --tensor-parallel-size 1 \
          --max-model-len 262144 \
          --max-num-seqs 10 \
          --gpu-memory-utilization 0.70 \
          --load-format fastsafetensors \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser-plugin /workspace/vllm/super_v3_reasoning_parser.py \
          --reasoning-parser super_v3 \
          --enable-prefix-caching \
          --trust-remote-code
    ports:
      - "8012:8012"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/flashinfer:/root/.cache/flashinfer
      - /home/tyler/.cache/vllm:/root/.cache/vllm
      - ./spark-vllm-docker/mods/nemotron-super:/app/mods/nemotron-super:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
