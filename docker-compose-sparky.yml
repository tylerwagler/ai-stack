services:
  # ---------------------------------------------------------
  # HOST METRICS (Port 3001, read-only)
  # GPU/host metrics collection via pynvml + psutil
  # ---------------------------------------------------------
  host-metrics:
    build:
      context: ./host-metrics
    container_name: host-metrics
    hostname: sparky
    restart: always
    ports:
      - "3001:3001"
    environment:
      - METRICS_API_KEY=${METRICS_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM (Port 8012)
  # Qwen3-Coder-Next — primary coding model
  # ---------------------------------------------------------
  vllm-qwen3-coder:
    image: vllm-node:latest
    container_name: vllm-qwen3-coder
    restart: unless-stopped
    command:
      - vllm
      - serve
      - Qwen/Qwen3-Coder-Next-FP8
      - --served-model-name
      - "Qwen3 Coder Next"
      - --host
      - "0.0.0.0"
      - --port
      - "8012"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "64"
      - --gpu-memory-utilization
      - "0.7"
      - -tp
      - "1"
      - --kv-cache-dtype
      - fp8
      - --dtype
      - bfloat16
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --load-format
      - fastsafetensors
      - --attention-backend
      - flashinfer
      - --enable-prefix-caching
      - --seed
      - "3407"
    ports:
      - "8012:8012"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
