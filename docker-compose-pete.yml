services:
  # ---------------------------------------------------------
  # VLLM Qwen3.5-9B (Port 8012)
  # Intel Qwen3.5-9B INT4 AutoRound — RTX 5070 (12GB)
  # ---------------------------------------------------------
  vllm-qwen3-5-9b:
    image: vllm/vllm-openai:latest-cu130
    container_name: qwen3.5-9b
    restart: unless-stopped
    environment:
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        pip install -q 'transformers>=5'
        exec vllm serve Intel/Qwen3.5-9B-int4-AutoRound \
          --served-model-name "Qwen3.5 9B" \
          --host 0.0.0.0 \
          --port 8012 \
          --max-model-len 16384 \
          --max-num-seqs 32 \
          --max-num-batched-tokens 8192 \
          --gpu-memory-utilization 0.75 \
          --load-format safetensors \
          --attention-backend flashinfer \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser qwen3 \
          --enable-prefix-caching \
          --trust-remote-code
    ports:
      - "8012:8012"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/flashinfer:/root/.cache/flashinfer
      - ${HOME}/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
