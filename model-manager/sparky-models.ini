[qwen3-coder]
backend = vllm
display_name = Qwen3 Coder Next
model = Qwen/Qwen3-Coder-Next-FP8
served_model_name = qwen3-coder
port = 8012
gpu_memory = 0.7
tp = 1
max_model_len = 262144
max_num_seqs = 64
max_ctx = 262144
kv_cache_dtype = fp8
vram_base = 8000
vram_per_1k_ctx = 100
vllm_args = --enable-auto-tool-choice --tool-call-parser qwen3_coder --load-format fastsafetensors --attention-backend flashinfer --enable-prefix-caching --dtype bfloat16 --seed 3407
vllm_mods = fix-qwen3-coder-next
default_temperature = 1.0
default_top_p = 0.95
default_top_k = 40
default_min_p = 0.01
max_output = 16384
