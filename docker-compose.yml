services:
  # ---------------------------------------------------------
  # LLAMA.CPP (Port 8010)
  # GLM-4.7-Flash — primary generation model
  # ---------------------------------------------------------
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: llama-server
    restart: unless-stopped
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8010"
      - --metrics
      - --poll
      - "100"
      - --alias
      - "GLM 4.7 Flash"
      - --hf-repo
      - unsloth/GLM-4.7-Flash-GGUF
      - --hf-file
      - GLM-4.7-Flash-UD-Q6_K_XL.gguf
      - --ctx-size
      - "131072"
      - --tensor-split
      - "23,24"
      - --parallel
      - "1"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - "on"
      - --temp
      - "0.7"
      - --top-p
      - "1.0"
      - --min-p
      - "0.01"
      - --seed
      - "3407"
    ports:
      - "8010:8010"
    volumes:
      - /home/tyler/.cache/llama.cpp:/root/.cache/llama.cpp
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ai-stack-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # VLLM QWEN3-14B (Port 8014)
  # Qwen3-14B-GPTQ-Int8 — subagent model (tool calling)
  # ---------------------------------------------------------
  vllm-qwen3-14b:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen3-14b
    restart: unless-stopped
    entrypoint: ["vllm", "serve"]
    command:
      - JunHowie/Qwen3-14B-GPTQ-Int8
      - --served-model-name
      - "Qwen3 14B"
      - --host
      - "0.0.0.0"
      - --port
      - "8014"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.95"
      - -tp
      - "2"
      - --quantization
      - gptq
      - --dtype
      - float16
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --enable-prefix-caching
      - --seed
      - "3407"
      - --disable-frontend-multiprocessing
    ports:
      - "8014:8014"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - ai-stack-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # QDRANT (Port 6333)
  # Vector database for document search
  # ---------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-stack-net

  # ---------------------------------------------------------
  # VALKEY (Port 6379)
  # Redis-compatible cache for SearXNG
  # ---------------------------------------------------------
  valkey:
    image: valkey/valkey:8-alpine
    container_name: valkey
    restart: always
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    networks:
      - ai-stack-net

  # ---------------------------------------------------------
  # SEARXNG (Port 8888)
  # Private web search engine for RAG retrieval
  # ---------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: always
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - ai-stack-net
    depends_on:
      - valkey

  # ---------------------------------------------------------
  # AI PROXY (Port 8081)
  # Lightweight model routing proxy — passes through both
  # Anthropic and OpenAI formats without translation.
  # ---------------------------------------------------------
  ai-proxy:
    build:
      context: ./ai-proxy
    container_name: ai-proxy
    restart: always
    ports:
      - "8081:8081"
    networks:
      - ai-stack-net

  # ---------------------------------------------------------
  # GATEWAY (Port 3000)
  # Nginx reverse proxy: /v1/* → ai-proxy (with auth), /* → Open WebUI
  # ---------------------------------------------------------
  gateway:
    build:
      context: ./gateway
    container_name: gateway
    restart: always
    ports:
      - "3000:80"
    networks:
      - ai-stack-net
    depends_on:
      - open-webui
      - ai-proxy

  # ---------------------------------------------------------
  # OPEN WEBUI (internal, behind gateway)
  # Web chat interface with built-in RAG
  # ---------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    restart: always
    environment:
      # --- LLM Backend (ai-proxy routes to correct model) ---
      - OPENAI_API_BASE_URLS=http://ai-proxy:8081/v1
      - OPENAI_API_KEYS=sk-no-key-required
      # --- API Keys (allow users to generate sk-* keys) ---
      - ENABLE_API_KEYS=true
      # --- Embeddings (vLLM GPU service) ---
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://vl-embed-gpu:8015/v1
      - RAG_OPENAI_API_KEY=sk-no-key-required
      - RAG_EMBEDDING_MODEL=Qwen/Qwen3-VL-Embedding-2B
      - RAG_EMBEDDING_BATCH_SIZE=16
      # --- Vector DB (Qdrant) ---
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
      # --- Web Search (SearXNG) ---
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      # --- Hybrid Search + Reranking (vLLM on Sparky, direct) ---
      - ENABLE_RAG_HYBRID_SEARCH=true
      - RAG_RERANKING_MODEL=Qwen/Qwen3-VL-Reranker-2B
      - RAG_RERANKING_ENGINE=external
      - RAG_EXTERNAL_RERANKER_URL=http://10.20.10.10:8016/v1/rerank
      - RAG_EXTERNAL_RERANKER_API_KEY=sk-no-key-required
      - RAG_TOP_K=10
      - RAG_RELEVANCE_THRESHOLD=0.1
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ai-stack-net
    depends_on:
      - ai-proxy
      - qdrant
      - searxng

  # ---------------------------------------------------------
  # FAN CONTROL (internal, no ports)
  # GPU fan/power curve controller (runs ONLY on Ellie)
  # ---------------------------------------------------------
  fan-control:
    build:
      context: ./fan-control
    container_name: fan-control
    hostname: ellie
    restart: always
    privileged: true
    environment:
      - FAN_SETPOINTS=50:30 70:65 78:95 80:100
      - POWER_SETPOINTS=70:230 80:175 85:125
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  ai-stack-net:
    external: true

volumes:
  open_webui_data:
  qdrant_data:
  valkey_data:
