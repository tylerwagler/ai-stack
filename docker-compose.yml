include:
  - path: supabase-ai/docker-compose.yml

services:
  # ---------------------------------------------------------
  # llama.cpp image (build-only target — model-manager spawns containers from this image)
  # ---------------------------------------------------------
  llama-server:
    build:
      context: ./llama.cpp
      dockerfile: .devops/cuda-new.Dockerfile
      target: server
      args:
        CUDA_VERSION: "13.1.1"
    image: llama-cpp-server:local
    profiles:
      - build-only

  # ---------------------------------------------------------
  # MODEL MANAGER (Port 8100)
  # Dynamic container manager — loads/unloads llama.cpp models on demand
  # ---------------------------------------------------------
  model-manager:
    build:
      context: ./model-manager
      args:
        MODELS_INI: ellie-models.ini
    container_name: model-manager
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/tyler/.cache/llama.cpp:/cache/llama.cpp
      - /home/tyler/.cache/huggingface/hub:/cache/huggingface/hub:ro
    environment:
      - LLAMA_IMAGE=llama-cpp-server:local
      - MAX_CONCURRENT_MODELS=1
      - LLAMA_CACHE_DIR=/cache/llama.cpp
      - HF_CACHE_DIR=/cache/huggingface/hub

  ai-proxy:
    build:
      context: ./ai-proxy
    container_name: ai-proxy
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PROXY_PORT=8081
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5433
      - ELLIE_MANAGER_HOST=${ELLIE_MANAGER_HOST:-172.17.0.1:8100}
      - SPARKY_MANAGER_HOST=${SPARKY_MANAGER_HOST:-10.20.10.10:8100}
      - SUPABASE_INTERNAL_URL=http://ai-supabase-kong:8000
    networks:
      - default
      - ai-stack-net
    volumes:
      - ./ai-proxy/logs:/app/logs
      - ./models.ini:/app/models.ini
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------
  # HOST METRICS (Port 3001, read-only)
  # GPU/host metrics collection via pynvml + psutil
  # ---------------------------------------------------------
  host-metrics:
    build:
      context: ./host-metrics
    container_name: host-metrics
    hostname: ellie
    restart: always
    ports:
      - "3001:3001"
    networks:
      - default
      - ai-stack-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # FAN CONTROL (internal, no ports)
  # GPU fan/power curve controller (runs ONLY on Ellie)
  # ---------------------------------------------------------
  fan-control:
    build:
      context: ./fan-control
    container_name: fan-control
    hostname: ellie
    restart: always
    privileged: true
    environment:
      - FAN_SETPOINTS=50:30 70:65 78:95 80:100
      - POWER_SETPOINTS=70:230 80:175 85:125
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  stripe-handler:
    build:
      context: ./stripe-handler
    container_name: stripe-handler
    restart: always
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5433
      - PORTAL_URL=https://ellie.elytrondefense.com
    networks:
      - default
      - ai-stack-net
    depends_on:
      db:
        condition: service_healthy

  ai-portal:
    build:
      context: ./ai-portal
      args:
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: ai-portal
    restart: always
    ports:
      - "3000:80"
    networks:
      - default
      - ai-stack-net

networks:
  ai-stack-net:
    external: true

volumes:
  llama_cache:
