include:
  - path: supabase-ai/docker-compose.yml

services:
  # ---------------------------------------------------------
  # LLM Inference Engine (Port 8082, localhost only)
  # llama.cpp CUDA server for local model inference
  # ---------------------------------------------------------
  llama-server:
    build:
      context: ./llama.cpp
      dockerfile: .devops/cuda-new.Dockerfile
      target: server
      args:
        CUDA_VERSION: "13.1.1"
    image: llama-cpp-server:local
    container_name: llama-server
    restart: always
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - llama_cache:/models
      - ./models.ini:/app/models.ini
      - ./llama.cpp/entrypoint.sh:/entrypoint.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - LLAMA_API_KEY=${LLAMA_API_KEY}
    entrypoint: ["/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f -H \"Authorization: Bearer $LLAMA_API_KEY\" http://localhost:8082/chat/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s

  ai-proxy:
    build:
      context: ./ai-proxy
    container_name: ai-proxy
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PROXY_PORT=8081
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5433
    networks:
      - default
      - ai-stack-net
    volumes:
      - ./ai-proxy/logs:/app/logs
      - ./models.ini:/app/models.ini
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------
  # HOST METRICS (Port 3001, read-only)
  # GPU/host metrics collection via pynvml + psutil
  # ---------------------------------------------------------
  host-metrics:
    build:
      context: ./host-metrics
    container_name: host-metrics
    hostname: ellie
    restart: always
    ports:
      - "3001:3001"
    environment:
      - LLAMA_HOST=llama-server
      - LLAMA_PORT=8082
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      - LLAMA_API_PREFIX=/chat
      - METRICS_API_KEY=${METRICS_API_KEY}
    networks:
      - default
      - ai-stack-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # FAN CONTROL (internal, no ports)
  # GPU fan/power curve controller (runs ONLY on Ellie)
  # ---------------------------------------------------------
  fan-control:
    build:
      context: ./fan-control
    container_name: fan-control
    hostname: ellie
    restart: always
    privileged: true
    environment:
      - FAN_SETPOINTS=50:30 70:65 78:95 80:100
      - POWER_SETPOINTS=70:230 80:175 85:125
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  stripe-handler:
    build:
      context: ./stripe-handler
    container_name: stripe-handler
    restart: always
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5433
      - PORTAL_URL=https://ellie.elytrondefense.com
    networks:
      - default
      - ai-stack-net
    depends_on:
      db:
        condition: service_healthy

  ai-portal:
    build:
      context: ./ai-portal
      args:
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    container_name: ai-portal
    restart: always
    ports:
      - "3000:80"
    networks:
      - default
      - ai-stack-net
    environment:
      - METRICS_API_KEY=${METRICS_API_KEY}

networks:
  ai-stack-net:
    external: true

volumes:
  llama_cache:
