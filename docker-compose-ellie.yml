services:
  # ---------------------------------------------------------
  # VLLM QWEN3-CODER (Port 8014)
  # Qwen3-Coder-30B-A3B INT4 AutoRound — subagent model (tool calling)
  # ---------------------------------------------------------
  ellie-qwen3-coder:
    build:
      context: ./vllm-ellie
    image: vllm-ellie:latest
    container_name: ellie-qwen3-coder
    restart: unless-stopped
    entrypoint: ["vllm", "serve"]
    command:
      - Intel/Qwen3-Coder-30B-A3B-Instruct-int4-AutoRound
      - --served-model-name
      - "Qwen3 Coder 30B"
      - --host
      - "0.0.0.0"
      - --port
      - "8014"
      - --max-model-len
      - "65536"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.90"
      - -tp
      - "2"
      - --dtype
      - float16
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --seed
      - "3407"
    environment:
      - LD_LIBRARY_PATH=/lib/x86_64-linux-gnu
    ports:
      - "8014:8014"
    volumes:
      - /home/tyler/.cache/huggingface:/root/.cache/huggingface
      - /home/tyler/.cache/vllm:/root/.cache/vllm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - ai-stack-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------
  # QDRANT (Port 6333)
  # Vector database for document search
  # ---------------------------------------------------------
  ellie-qdrant:
    image: qdrant/qdrant:latest
    container_name: ellie-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-stack-net

  # ---------------------------------------------------------
  # VALKEY (Port 6379)
  # Redis-compatible cache for SearXNG
  # ---------------------------------------------------------
  ellie-valkey:
    image: valkey/valkey:8-alpine
    container_name: ellie-valkey
    restart: always
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data
    networks:
      - ai-stack-net

  # ---------------------------------------------------------
  # SEARXNG (Port 8888)
  # Private web search engine for RAG retrieval
  # ---------------------------------------------------------
  ellie-searxng:
    image: searxng/searxng:latest
    container_name: ellie-searxng
    restart: always
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - ai-stack-net
    depends_on:
      - ellie-valkey

  # ---------------------------------------------------------
  # OPEN WEBUI (Port 3000)
  # Web chat interface with built-in RAG
  # ---------------------------------------------------------
  ellie-open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: ellie-open-webui
    restart: always
    environment:
      # --- LLM Backends (direct connection to vLLM services) ---
      - OPENAI_API_BASE_URLS=http://ellie-qwen3-coder:8014/v1;http://10.20.10.10:8012/v1
      - OPENAI_API_KEYS=sk-no-key-required;sk-no-key-required
      # --- API Keys (allow users to generate sk-* keys) ---
      - ENABLE_API_KEYS=true
      # --- Embeddings (vLLM GPU service on Sparky) ---
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://10.20.10.10:8015/v1
      - RAG_OPENAI_API_KEY=sk-no-key-required
      - RAG_EMBEDDING_MODEL=Qwen/Qwen3-VL-Embedding-2B
      - RAG_EMBEDDING_BATCH_SIZE=16
      # --- Vector DB (Qdrant) ---
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://ellie-qdrant:6333
      # --- Web Search (SearXNG) ---
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://ellie-searxng:8080/search?q=<query>
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=10
      # --- Hybrid Search + Reranking (vLLM on Sparky, direct) ---
      - ENABLE_RAG_HYBRID_SEARCH=true
      - RAG_RERANKING_MODEL=Qwen/Qwen3-VL-Reranker-2B
      - RAG_RERANKING_ENGINE=external
      - RAG_EXTERNAL_RERANKER_URL=http://10.20.10.10:8016/v1/rerank
      - RAG_EXTERNAL_RERANKER_API_KEY=sk-no-key-required
      - RAG_TOP_K=10
      - RAG_RELEVANCE_THRESHOLD=0.1
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    networks:
      - ai-stack-net
    depends_on:
      - ellie-qwen3-coder
      - ellie-qdrant
      - ellie-searxng

  # ---------------------------------------------------------
  # FAN CONTROL (internal, no ports)
  # GPU fan/power curve controller (runs ONLY on Ellie)
  # ---------------------------------------------------------
  ellie-fan-control:
    build:
      context: ./fan-control
    container_name: ellie-fan-control
    hostname: ellie
    restart: always
    privileged: true
    environment:
      - FAN_SETPOINTS=50:30 70:65 78:95 80:100
      - POWER_SETPOINTS=70:230 80:175 85:125
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  ai-stack-net:
    external: true

volumes:
  open_webui_data:
  qdrant_data:
  valkey_data:
